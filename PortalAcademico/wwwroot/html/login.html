<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portal Acadêmico</title>
    <link rel="stylesheet" href="../css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <!-- PAINEL ESQUERDO -->
        <div class="brand-section">
            <div class="brand-header">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <div class="brand-title">
                    <h2>Portal Acadêmico</h2>
                    <p>Centro Universitário</p>
                </div>
            </div>

            <div class="brand-body">
                <h1>Bem-vindo<br>de volta</h1>
                <p>Acesse sua conta para continuar seus estudos e acompanhar seu progresso acadêmico.</p>
            </div>

            <div class="accent-line"></div>
        </div>

        <!-- PAINEL DIREITO -->
        <div class="form-section">
            <div class="form-header">
                <h2>Acessar conta</h2>
                <p>Insira suas credenciais para continuar</p>
            </div>

            <!-- FEEDBACK -->
            <div id="feedbackMessage" class="feedback-message"></div>

            <form id="loginForm" class="form-grid">
                <div class="input-group">
                    <label for="username">Usuário ou Email</label>
                    <div class="input-wrapper">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
                        <input type="text" id="username" placeholder="Digite seu usuário ou email" autocomplete="off" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                        <input type="password" id="password" placeholder="Digite sua senha" required>
                        <button type="button" class="btn-toggle-eye" id="togglePassword">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
                        </button>
                    </div>
                </div>

                <label class="checkbox-label" style="display:flex; align-items:center; gap:8px; font-size:12px; color:#475569; cursor:pointer;">
                    <input type="checkbox" id="rememberMe" style="width:14px; height:14px; accent-color:#4f46e5;">
                    <span>Lembrar de mim</span>
                </label>

                <button type="submit" class="btn-submit" id="loginBtn">Entrar</button>
            </form>

            <div class="divider"><span>ou</span></div>

            <div class="login-footer" style="text-align:center; font-size:12px; color:#64748b; margin-top:16px;">
                <p>Não tem uma conta? <a href="cadastro.html" style="color:#4f46e5; font-weight:600; text-decoration:none;">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <!-- Script de Login -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Se já logado, vai pro index
            const activeUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            if (activeUser && activeUser !== 'null' && activeUser !== 'undefined') {
                window.location.href = 'index.html';
                return;
            }

            // 2. Elementos
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const feedbackMsg = document.getElementById('feedbackMessage');
            const togglePassword = document.getElementById('togglePassword');

            // 3. Toggle senha
            const eyeOpen = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
            const eyeClosed = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;
            togglePassword.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePassword.innerHTML = eyeClosed;
                } else {
                    passwordInput.type = 'password';
                    togglePassword.innerHTML = eyeOpen;
                }
            });

            // 4. Feedback
            function showFeedback(text, type) {
                feedbackMsg.textContent = text;
                feedbackMsg.className = `feedback-message ${type}`;
            }

            // 5. Submit (SEM curso — pega do cadastro do usuário)
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                e.stopPropagation();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username) { showFeedback('Preencha o usuário!', 'error'); usernameInput.focus(); return; }
                if (!password) { showFeedback('Preencha a senha!', 'error'); passwordInput.focus(); return; }

                const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                const foundUser = users.find(u =>
                    (u.username === username || u.email === username) && u.password === password
                );

                const isAdmin = (username === 'admin' && password === '123456');

                if (foundUser || isAdmin) {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Entrando...';

                    const userData = foundUser ? {
                        id: foundUser.id,
                        firstName: foundUser.firstName,
                        lastName: foundUser.lastName,
                        name: foundUser.fullName || foundUser.firstName,
                        email: foundUser.email,
                        username: foundUser.username,
                        course: foundUser.course,                 // ← pega do cadastro
                        courseName: (foundUser.course || '').toUpperCase(),
                        semester: foundUser.semester || '1'
                    } : {
                        id: Date.now(),
                        firstName: 'Aluno',
                        lastName: 'Admin',
                        name: 'Aluno Admin',
                        email: 'admin@portal.com',
                        username: 'admin',
                        course: 'biomedicina',
                        courseName: 'BIOMEDICINA',
                        semester: '1'
                    };

                    localStorage.setItem('currentUser', JSON.stringify(userData));
                    sessionStorage.removeItem('currentUser');

                    showFeedback('Login realizado! Redirecionando...', 'success');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 600);
                } else {
                    showFeedback('Usuário ou senha incorretos. Verifique ou cadastre-se.', 'error');
                }
            });
        });
    </script>

</body>
</html>
